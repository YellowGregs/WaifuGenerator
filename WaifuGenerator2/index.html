<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waifu Generator 2</title>
  <style>
    :root {
      --page-bg: #18141d;
      --panel-bg: rgba(22, 21, 29, 0.88);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-main: #f7f2ff;
      --text-soft: #c6bdd6;
      --accent: #ff8a5b;
      --accent-strong: #ff6b3d;
      --surface: rgba(255, 255, 255, 0.08);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-main);
      background: var(--page-bg);
    }

    .shell {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      padding: 24px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .controls, .stage {
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .controls {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .eyebrow, .status { margin: 0; }
    .eyebrow {
      color: var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }
    .status, label { color: var(--text-soft); }
    h1 { margin: 0; font-size: clamp(2rem, 4vw, 3rem); line-height: 1; }
    .field { display: grid; gap: 8px; }

    select, button {
      width: 100%;
      border: none;
      border-radius: 14px;
      font: inherit;
    }

    .select-shell { position: relative; }

    select {
      appearance: none;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.11);
      color: #f7f2ff;
      -webkit-text-fill-color: #f7f2ff;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    select option {
      color: var(--text-main);
      background: #241c29;
    }

    .select-arrow {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--text-soft);
      border-bottom: 2px solid var(--text-soft);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
    }

    .mode-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .mode-option:has(input:checked) {
      background: rgba(255, 138, 91, 0.18);
      transform: translateY(-1px);
    }

    .mode-option input {
      appearance: none;
      width: 14px;
      height: 14px;
      margin: 0;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: transparent;
    }

    .mode-option:has(input:checked) input {
      border-color: var(--accent);
      background: var(--accent);
    }

    button {
      padding: 15px 18px;
      color: #141115;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
    }

    .stage {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .image-frame {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border-radius: 20px;
      background: #17151d;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-frame::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 40%;
      background: linear-gradient(180deg, transparent, rgba(10, 9, 14, 0.72));
      pointer-events: none;
    }

    .loading-track {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    .load-bar {
      width: 35%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transform: translateX(-120%);
      opacity: 0;
    }

    .load-bar.is-active {
      opacity: 1;
      animation: slide-bar 1s ease-in-out infinite;
    }

    .image-meta {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.34);
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .status.error { color: #ffb3b3; }

    @keyframes slide-bar {
      from { transform: translateX(-120%); }
      to { transform: translateX(320%); }
    }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .image-frame { min-height: 380px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="controls">
      <p class="eyebrow">Version 2</p>
      <h1>Using Waifu.pics API</h1>

      <div class="field">
        <label>Content mode</label>
        <div class="mode-toggle" role="radiogroup" aria-label="Content mode">
          <label class="mode-option" for="mode-sfw">
            <input id="mode-sfw" type="radio" name="mode" value="sfw" checked>
            <span>SFW</span>
          </label>
          <label class="mode-option" for="mode-nsfw">
            <input id="mode-nsfw" type="radio" name="mode" value="nsfw">
            <span>NSFW</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="tag-select">Category</label>
        <div class="select-shell">
          <select id="tag-select"></select>
          <span class="select-arrow" aria-hidden="true"></span>
        </div>
      </div>

      <button id="generate-button" type="button">Fetch image</button>
      <div class="loading-track" aria-hidden="true">
        <div id="load-bar" class="load-bar"></div>
      </div>
      <p id="status" class="status">Ready to load a new image.</p>
    </section>

    <section class="stage">
      <div class="image-frame">
        <img id="waifu-image" src="https://giffiles.alphacoders.com/349/34946.gif" alt="Preview artwork">
        <div class="image-meta">
          <span id="mode-pill" class="pill">SFW</span>
          <span id="tag-pill" class="pill">waifu</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const tag_sets = {
      sfw: ["waifu", "neko", "shinobu", "megumin", "bully", "cuddle", "cry", "hug", "awoo", "kiss", "lick", "pat", "smug", "bonk", "yeet", "blush", "smile", "wave", "highfive", "handhold", "nom", "bite", "glomp", "slap", "kill", "kick", "happy", "wink", "poke", "dance", "cringe"],
      nsfw: ["waifu", "neko", "trap", "blowjob"]
    };

    const tag_select = document.getElementById("tag-select");
    const generate_button = document.getElementById("generate-button");
    const waifu_image = document.getElementById("waifu-image");
    const status_line = document.getElementById("status");
    const mode_pill = document.getElementById("mode-pill");
    const tag_pill = document.getElementById("tag-pill");
    const load_bar = document.getElementById("load-bar");

    function current_mode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    function update_tag_options() {
      const active_mode = current_mode();
      tag_select.innerHTML = "";
      for (const tag_name of tag_sets[active_mode]) {
        const option = document.createElement("option");
        option.value = tag_name;
        option.textContent = tag_name;
        tag_select.appendChild(option);
      }
      sync_pills();
    }

    function sync_pills() {
      mode_pill.textContent = current_mode().toUpperCase();
      tag_pill.textContent = tag_select.value || "none";
    }

    async function generate_image() {
      const active_mode = current_mode();
      const selected_tag = tag_select.value;
      sync_pills();
      status_line.textContent = "Loading a fresh image...";
      status_line.classList.remove("error");
      generate_button.disabled = true;
      load_bar.classList.add("is-active");

      try {
        const response = await fetch(`https://api.waifu.pics/${active_mode}/${selected_tag}`);
        if (!response.ok) {
          throw new Error(`Request failed with ${response.status}`);
        }

        const payload = await response.json();
        if (!payload.url) {
          throw new Error("Image URL missing in API response");
        }

        await preload_image(payload.url);
        waifu_image.src = payload.url;
        waifu_image.alt = `${active_mode.toUpperCase()} ${selected_tag} image`;
        status_line.textContent = `Showing ${selected_tag} from ${active_mode.toUpperCase()}.`;
      } catch (error) {
        status_line.textContent = `Could not load an image. ${error.message}`;
        status_line.classList.add("error");
      } finally {
        generate_button.disabled = false;
        load_bar.classList.remove("is-active");
      }
    }

    function preload_image(url) {
      return new Promise((resolve, reject) => {
        const preloaded_image = new Image();
        preloaded_image.onload = resolve;
        preloaded_image.onerror = () => reject(new Error("Image preload failed"));
        preloaded_image.src = url;
      });
    }

    document.querySelectorAll('input[name="mode"]').forEach((mode_input) => {
      mode_input.addEventListener("change", () => {
        update_tag_options();
        generate_image();
      });
    });

    tag_select.addEventListener("change", sync_pills);
    generate_button.addEventListener("click", generate_image);

    update_tag_options();
    generate_image();
  </script>
</body>
</html>
