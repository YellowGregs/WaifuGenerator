<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waifu Generator 5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="sidebar">
      <p class="eyebrow">Version 5</p>
      <h1>Using Nekos.best API</h1>

      <label class="field">
        <span>Category</span>
        <div class="select-shell">
          <select id="category_select"></select>
          <span class="select-arrow" aria-hidden="true"></span>
        </div>
      </label>

      <div class="action-row">
        <button id="generate_button" type="button">Fetch media</button>
      </div>

      <label class="theme-row" for="theme_toggle">
        <span>Warm night theme</span>
        <input type="checkbox" id="theme_toggle">
      </label>

      <div class="loading-track" aria-hidden="true">
        <div id="load_bar" class="load-bar"></div>
      </div>
      <p id="status_line" class="status-line">Ready.</p>
    </section>

    <section class="viewer">
      <div class="media-frame">
        <img id="result_media" src="" alt="Random nekos.best result">
      </div>
      <div class="details-row">
        <span id="category_badge" class="badge">neko</span>
      </div>
      <div class="meta-panel">
        <p id="meta_line" class="meta-line">Category list loads from the API.</p>
        <a id="source_link" class="source-link" href="#" target="_blank" rel="noreferrer">Open source</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
