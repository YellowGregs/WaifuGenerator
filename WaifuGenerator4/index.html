<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waifu Generator 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero-panel">
      <p class="eyebrow">Version 4</p>
      <h1>Using Waifu.im API</h1>

      <div class="field-grid">
        <label class="field">
          <span>Mode</span>
          <div class="select-shell">
            <select id="mode_select">
              <option value="sfw">SFW</option>
              <option value="nsfw">NSFW</option>
            </select>
            <span class="select-arrow" aria-hidden="true"></span>
          </div>
        </label>

        <label class="field">
          <span>Tag</span>
          <div class="select-shell">
            <select id="tag_select"></select>
            <span class="select-arrow" aria-hidden="true"></span>
          </div>
        </label>
      </div>

      <div class="button-row">
        <button id="refresh_button" type="button">Load artwork</button>
      </div>

      <div class="loading-track" aria-hidden="true">
        <div id="load_bar" class="load-bar"></div>
      </div>
      <p id="status_line" class="status-line">Loading artwork...</p>
    </section>

    <section class="result-panel">
      <div class="image-shell">
        <img id="result_image" src="" alt="Waifu.im result">
      </div>

      <div class="meta-panel">
        <div class="meta-row">
          <span class="meta-label">Artist source</span>
          <a id="source_link" href="#" target="_blank" rel="noreferrer">Open source</a>
        </div>

        <div class="meta-row">
          <span class="meta-label">Tags</span>
          <div id="tags_container" class="tags-container"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
