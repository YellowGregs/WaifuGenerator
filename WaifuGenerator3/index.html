<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waifu Generator 3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <section class="control-panel">
      <p class="eyebrow">Version 3</p>
      <h1>Using Waifu.pics API</h1>

      <div class="mode-switch" role="radiogroup" aria-label="Choose content mode">
        <label class="mode-card" for="mode_sfw">
          <input type="radio" id="mode_sfw" name="content_mode" value="sfw" checked>
          <span>SFW</span>
        </label>
        <label class="mode-card" for="mode_nsfw">
          <input type="radio" id="mode_nsfw" name="content_mode" value="nsfw">
          <span>NSFW</span>
        </label>
      </div>

      <label class="field-label" for="tag_select">Category</label>
      <div class="select-shell">
        <select id="tag_select" class="tag-select"></select>
        <span class="select-arrow" aria-hidden="true"></span>
      </div>

      <div class="action-row">
        <button id="generate_button" type="button">Fetch image</button>
        <button id="shuffle_button" type="button" class="ghost-button">Random tag</button>
      </div>

      <div class="loading-track" aria-hidden="true">
        <div id="load_bar" class="load-bar"></div>
      </div>
      <p id="status_line" class="status-line">Loading the first image...</p>
    </section>

    <section class="viewer-panel">
      <div class="image-card">
        <img id="random_image" class="random-image" src="" alt="Generated anime artwork">
        <div class="image-overlay">
          <span id="mode_badge" class="badge">SFW</span>
          <span id="tag_badge" class="badge">waifu</span>
        </div>
      </div>
    </section>
  </main>

  <script src="./main.js"></script>
</body>
</html>
